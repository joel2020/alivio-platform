name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/alivio-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/alivio-backend/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('backend/alivio-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/alivio-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/alivio-backend/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('backend/alivio-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm ci

      - name: Syntax check backend and scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check server.js

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend scripts -type f -name '*.js' -print0)

  smoke-mock:
    runs-on: ubuntu-latest
    needs: [lint, check]
    defaults:
      run:
        working-directory: backend/alivio-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/alivio-backend/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('backend/alivio-backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests in mock mode
        shell: bash
        env:
          APP_MODE: mock
          PORT: 8080
        run: |
          set -euo pipefail

          node server.js > /tmp/alivio-backend.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:${PORT}/health" > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "http://127.0.0.1:${PORT}/health" > /dev/null
          npm run smoke

  article-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://alivio-qa.invalid
          VITE_SUPABASE_ANON_KEY: local-browser-tests
      - run: npm run test:article-server

  candidate-ats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/ats-sql" --no-save --package-lock=false @electric-sql/pglite@0.5.8
      - name: Test application validation and delivery
        run: npx tsx --test tests/server/application-workflow.test.ts
      - name: Test migration, tenant policies, and durable messaging
        run: node --test tests/server/application-database.test.mjs
        env:
          ATS_PGLITE_MODULE: ${{ runner.temp }}/ats-sql/node_modules/@electric-sql/pglite/dist/index.js
